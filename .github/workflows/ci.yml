name: AetherLake CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aetherlake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Validate shell
        run: shellcheck scripts/*.sh tests/*.sh docker/*/*.sh
      - name: Validate Compose
        run: cp .env.example .env && docker compose config --quiet
      - name: Validate demo application
        run: python -m py_compile demo-ui/app.py load_test.py scripts/cdf-parity.py
      - name: Install model tooling
        run: pip install -r requirements-dev.txt cognite-toolkit==0.5.10
      # Two independent validators: Cognite's own parser must accept the YAML, and the
      # compiler must agree that the checked-in SQL is what that YAML produces.
      - name: Validate model against the Cognite Toolkit
        run: cd models && cdf build --env dev
      - name: Check generated model SQL is current
        run: python scripts/compile-model.py --check
      # A rule nobody can violate on purpose is a rule nobody has tested. `cdf build` accepts
      # this model; the compiler must not.
      - name: Model rules are enforced, not just documented
        run: |
          git apply demo/break-the-model.patch
          cd models && cdf build --env dev && cd ..
          python scripts/compile-model.py 2>compiler.err && {
            echo "::error::compiler accepted two CogniteAsset implementers"; exit 1; }
          grep -q "views implement cdf_cdm:CogniteAsset" compiler.err || {
            echo "::error::compiler failed, but not for the expected reason:"; cat compiler.err; exit 1; }
          git checkout models/ && rm -f compiler.err
          python scripts/compile-model.py

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Configure environment
        run: cp .env.example .env
      - name: Build pinned pg_lake and AetherLake images
        run: ./scripts/build-images.sh
      - name: Start clean stack
        run: docker compose up -d && ./scripts/wait-healthy.sh 600
      - name: Run smoke suite
        run: ./tests/smoke.sh
      - name: Probe pg_lake capabilities
        run: ./tests/pglake-probe.sh
      - name: Run semantic model suite
        run: ./tests/semantic-model.sh
      - name: Run SDM analytical job suite
        run: ./tests/sdm-job.sh
      - name: Prove the lake is open to another engine
        run: ./tests/openness.sh
      - name: Run object-storage failure suite
        run: ./tests/storage-failure.sh
      - name: Verify restart persistence
        run: docker compose restart && ./scripts/wait-healthy.sh 300 && ./tests/smoke.sh
      - name: Collect diagnostics
        if: always()
        run: docker compose ps && docker compose logs --no-color > aetherlake-ci.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aetherlake-ci-logs
          path: aetherlake-ci.log
          retention-days: 7
      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans
